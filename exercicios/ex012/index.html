<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo esta hospedado no meu própio servidor.</p>

    <!-- <video src="midia/Videouuu.mp4" width="750" controls></video> -->

    <video width="750" poster="imagens/PAISAGENS.png" controls>
        <source src="midia/Videouuu.mp4" type="video/mp4">
        <source src="midia/Videouuu.mpg" type="video/mp4">
        <source src="midia/videouuu.ogv" type="video/ogg">
        <p>Seu navegador não tem compatiblidade com reprodução de vídeos.</p>
    </video>

    <h1>Inserindo vídeos do YouTube</h1>
    <iframe width="560" height="315" 
    src="https://www.youtube.com/embed/DfloaXUKr2o?si=NAUdQyI1Zi_qgGXf" 
    title="YouTube video player" frameborder="0" allow="accelerometer; autoplay;
     clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
    <h1>Inserindo vídeos do Vimeo</h1>
    <iframe title="vimeo-player" 
    src="https://player.vimeo.com/video/257399106?h=b4f1975b25" 
    width="640" height="360" frameborder="0" 
    referrerpolicy="strict-origin-when-cross-origin" 
    allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   
    allowfullscreen></iframe>
</body>
</html>
