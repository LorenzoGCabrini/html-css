<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google Fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap');
        body {
            font-family: "Jacquard 12", system-ui;
            font-weight: 400;
            font-style: normal;
            
        }
        h1 {
             font-family: "Henny Penny", system-ui, serif;
            font-weight: 400;
            font-style: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. 
    Maiores reiciendis repellendus eum est quas molestiae, 
    suscipit possimus! Hic, ratione animi eos, natus ab possimus 
    architecto mollitia laborum, esse neque officia!</p>
</body>
</html>
