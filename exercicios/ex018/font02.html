<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Les Flos';
            src: url('fonts/Les\ Flos\ Chaos.otf') format(opentype), 
            url('fonts/Les\ Flos\ Sage.otf') format(opentype), 
            url('fonts/Les\ Flos\ Sans.otf') format(opentype);
            font-weight: normal;
            font-style: normal;

            /*
            |   Tipos de format()
            |   - opentype (otf)
            |   - truetype (ttf)
            |   - embedded-opentype
            |   - truetype-aat (Apple advanced Typography)
            |   - svg
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'Les Flos', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. 
    Architecto reprehenderit tenetur sapiente alias inventore 
    itaque iusto, neque consectetur maxime vero incidunt totam 
    quibusdam at unde deserunt sunt reiciendis, eos explicabo!</p>
</body>
</html>
